# fly.toml app configuration file generated for pairrelay on 2026-07-07T23:50:12-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pairrelay'
primary_region = 'iad'

[build]
[env]
  PAIRRELAY_RELAY_HOST = '0.0.0.0'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # Sessions are in-memory — must run exactly one machine or joins get 404.
  # After first deploy: fly scale count 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
